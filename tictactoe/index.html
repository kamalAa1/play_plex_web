<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PlayPlex | Tic-Tac-Toe Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <!-- Top Navigation Bar with Exit / Quit Button -->
    <div class="top-nav-bar">
      <button class="top-quit-btn" id="btnTopQuit" aria-label="Exit Game">
        <span class="quit-icon">✕</span>
        <span>Exit</span>
      </button>
    </div>

    <!-- Header -->
    <header class="game-header">
      <div class="brand">
        <div class="game-badge">⚡ PLAYPLEX 1V1 ARENA</div>
        <h1 class="game-title">Tic-Tac-<span>Toe</span></h1>
        <p class="game-hint">Single decisive round vs Bot</p>
      </div>
    </header>

    <!-- Turn Indicator -->
    <div class="turn-banner" id="turnBanner">
      <span class="turn-dot"></span>
      <span id="turnText">Your Turn (X)</span>
    </div>

    <!-- Game Board -->
    <main class="board-wrapper">
      <div class="board" id="board">
        <button class="cell" data-index="0" id="cell-0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" id="cell-1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" id="cell-2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" id="cell-3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" id="cell-4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" id="cell-5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" id="cell-6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" id="cell-7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" id="cell-8" aria-label="Cell 9"></button>

        <!-- Dynamic Win Strike Line -->
        <div class="strike-line" id="strikeLine"></div>
      </div>
    </main>

    <!-- Game Over Modal / Result Overlay -->
    <div class="modal-overlay" id="resultModal">
      <div class="modal-card">
        <div class="trophy-glow" id="modalGlow">🏆</div>
        <h2 class="modal-title" id="modalTitle">VICTORY!</h2>
        <p class="modal-subtitle" id="modalSubtitle">You defeated the Bot!</p>

        <div class="reward-box" id="rewardBox">
          <div class="coin-badge">
            <span class="coin-icon">🪙</span>
            <span class="coin-text" id="rewardText"></span>
          </div>
        </div>

        <div class="modal-actions" id="modalActions">
          <!-- Button dynamically rendered: Only appears if it's a DRAW to replay tiebreaker or on Defeat to play again -->
          <button class="action-btn btn-primary" id="btnReplayDraw" style="display: none;">Play Tiebreaker</button>
          <button class="action-btn btn-save" id="btnSavePoints">💾 Save Points</button>
          <button class="action-btn btn-exit" id="btnExit">🚪 Exit</button>
        </div>
      </div>
    </div>

    <!-- Canvas for Celebratory Confetti -->
    <canvas id="confettiCanvas"></canvas>
  </div>

  <script src="game.js"></script>
</body>

</html>
